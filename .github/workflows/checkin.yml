name: 福利吧自动签到
# ============================================
# 触发条件
# ============================================
on:
  schedule:
    # 早上 9:00 签到 (UTC 1:00 = 北京时间 9:00)
    - cron: '0 1 * * *'
    # 晚上 22:00 复查 (UTC 14:00 = 北京时间 22:00)
    - cron: '0 14 * * *'
    # 保活：每45天执行一次，提交空commit续命，避开60天休眠
    - cron: '0 0 */45 * *'
  # 支持手动触发（用于测试）
  workflow_dispatch:

# 全局权限：必须给，否则保活commit推送失败
permissions:
  contents: write

# ============================================
# 任务组
# ============================================
jobs:
  # 【原有签到任务】签到 + 复查逻辑
  checkin:
    # 只有签到/复查的cron才运行，保活cron不跑这个job
    if: github.event.schedule == '0 1 * * *' || github.event.schedule == '0 14 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 1. 拉取代码
      - name: 检出代码
        uses: actions/checkout@v4
      # 2. 设置 Python 环境
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 3. 安装依赖
      - name: 安装依赖
        run: pip install -r requirements.txt
      # 4. 判断当前是签到还是复查
      - name: 判断运行模式
        id: mode
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$SCHEDULE" = "0 1 * * *" ]; then
            echo "mode=checkin" >> $GITHUB_OUTPUT
            echo "当前模式: 早起签到" >> $GITHUB_STEP_SUMMARY
          elif [ "$SCHEDULE" = "0 14 * * *" ]; then
            echo "mode=verify" >> $GITHUB_OUTPUT
            echo "当前模式: 晚间复查" >> $GITHUB_STEP_SUMMARY
          else
            echo "mode=checkin" >> $GITHUB_OUTPUT
            echo "当前模式: 手动触发(默认签到)" >> $GITHUB_STEP_SUMMARY
          fi
      # 5. 执行签到脚本
      - name: 执行签到
        env:
          FORUM_COOKIE: ${{ secrets.FORUM_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          CHECKIN_MODE: ${{ steps.mode.outputs.mode }}
        run: python checkin.py

  # 【保活任务】自动空提交，防止仓库60天休眠
  keepalive:
    if: github.event.schedule == '0 0 */45 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 配置git身份
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: 生成保活标记文件 & 空提交
        run: |
          echo "keepalive: $(date -R)" > .keepalive
          git add .keepalive
          # 只有文件变化才提交，避免无变更报错
          git diff --cached --quiet || git commit -m "🤖 Auto keepalive commit, prevent repo sleep"
          git push
